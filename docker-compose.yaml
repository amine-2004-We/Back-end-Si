version: "3.9"

services:
# ============================================
  # REVERSE PROXY NGINX
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: zakoura_nginx
    ports:
      - "80:80"           # C'EST LA CLÉ ! Un seul point d'entrée
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - zakoura_net

  # ============================================
  # FRONTEND (React/Vite + Nginx interne)
  # ============================================
  frontend:
    build:
      context: ../fondation-zakoura-frontend-develop
      dockerfile: Dockerfile
    image: amineautomation/si-zakoura-frontend:latest
    container_name: zakoura_frontend
    environment:
      VITE_API_URL: /api
      VITE_STORAGE_URL: /storage

    restart: unless-stopped
    networks:
      - zakoura_net

  # ============================================
  # BACKEND (Laravel)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: amineautomation/si-zakoura-backend:latest
    container_name: zakoura_backend
    env_file:
      - .env-prod
    # ports:
    #   - "8000:8000"   # utile pour tester depuis le navigateur
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - zakoura_net
  
  # ============================================
  # DATABASE (PostgreSQL)
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: zakoura_db
    environment:
      POSTGRES_DB: SI-DOCKER-LATEST
      POSTGRES_USER: zakoura_user
      POSTGRES_PASSWORD: zakoura_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - zakoura_net

volumes:
  pgdata:

networks:
  zakoura_net:
    driver: bridge