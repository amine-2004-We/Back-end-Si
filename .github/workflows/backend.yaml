name: Backend CI/CD

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: amineautomation/si-zakoura-backend

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:

    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |

            cd /home/ubuntu/home/user/SI-Zakoura-back-end-

            docker-compose pull

            docker-compose down

            docker-compose up -d --force-recreate

            docker-compose exec -T backend php artisan migrate --force

            docker-compose exec -T backend php artisan config:cache

            docker-compose exec -T backend php artisan route:cache

            docker image prune -f

            echo '--- Logs backend (50 dernières lignes) ---'
            docker-compose logs --tail=50 backend

            echo '--- Logs db (50 dernières lignes) ---'
            docker-compose logs --tail=50 db

            echo '--- Logs frontend (50 dernières lignes) ---'
            docker-compose logs --tail=50 frontend

            echo '--- Logs nginx (50 dernières lignes) ---'
            docker-compose logs --tail=50 nginx